# Treasury Management Function (TMF) — configuration.
#
# Methodology: Sky Atlas A.2.3 waterfall (Steps 0–4) as parameterised by
# BA Labs' "TMF Configurations" post (forum.skyeco.com/t/28153) and the
# operator's TMF Calculator sheet (validated against the 2026-08-13 exec).
#
#   Step 0  Sky Net Revenue (SNR) of the cycle month — from the MSC post /
#           settlements/sky_total/<month>.
#   Step 1  20% security & maintenance (10% Core Council + 10% Fortification
#           Foundation) → one Core Council Buffer transfer (interim).
#   Step 2  Aggregate Backstop Capital retention: 50% of the remainder while
#           Sky Reserves < Turbo-Fill Floor; 50% × (1 − ABC/TBC) between Floor
#           and Target Backstop Capital (1.5% of USDS supply); 0% at target.
#   Step 3  Smart Burn Engine budget = remainder after Step 2, split 45%
#           (buy SKY → stakers) / 45% (USDS → stakers) / 10% (buy SKY → burn).
#           On-chain: kicker.kbump fixed at 6,000 USDS; splitter.hop is SOLVED
#           so that the engine spends the budget over a 365/12-day month;
#           splitter.burn = the two buying legs combined (55%).
#   Step 4  SKY staking rewards = 45% leg ÷ prior-month SKY TWAP, fronted by
#           the treasury through a 90-day DssVest stream sized for 3 months
#           (vestTot); the 10/55 share of the SKY actually bought under the
#           55% regime is burned in the following month's MSC spell.
#
# All addresses are Ethereum mainnet (chainlog.skyeco.com, 2026-08-26).

policy:
  step1_share: '0.20'                 # 10% Core Council + 10% Fortification
  step1_core_council_share: '0.10'
  step1_fortification_share: '0.10'
  step2_max_retention: '0.50'
  turbo_fill_floor: '150000000'       # USDS
  tbc_share_of_supply: '0.015'        # Target Backstop Capital = 1.5% × USDS supply
  step3_sky_rewards_share: '0.45'
  step3_usds_rewards_share: '0.45'
  step3_burn_share: '0.10'
  vest_runway_months: 3
  vest_tau_days: 90
  engine_month_days: '30.416666666666666667'   # 365/12
  kbump: '6000'                       # USDS per batch — held fixed; hop is solved
  sky_farm_rewards_duration: 604800   # 7 d — REWARDS_LSSKY_SKY, keeper schedule
  # First TMF cast — buys before this ran on the legacy 100%-burn engine
  # (SKY parked in the treasury) and are NOT burn-attributed; every later
  # kick is attributed with its own regime's splitter.burn.
  tmf_effective_from: '2026-08-17T14:02:23Z'
  # SBE BEAM bounds (2026-08-13 exec) — what the operator multisig may set
  # without a vote. The solved hop must respect them.
  beam_max_kbump: '12000'
  beam_min_hop: 550
  beam_max_rate_per_year: '350000000'

# ── Full-history dataset (settlements/tmf/data, scripts/build_tmf_history.py)
# Every Splitter kick since the Splitter was deployed (2024-09-17, block
# 20,770,191 — the first kick came 2024-11-14), plus every SKY burn. Persisted
# incrementally in the HyperSync log store (DATABASE_URL) and published as
# JSON aggregates + per-event CSVs for the msc-dashboard.
history:
  from_block: 20770191
  # Every Flapper the Splitter has ever pointed at (File(flapper) events).
  # 0xc5a9… is the LP-depositing FlapperUniV2 (never kicked before it was
  # replaced on 2024-09-30); 0x374D… is FlapperUniV2SwapOnly, live since.
  flappers:
    - '0xc5A9CaeBA70D6974cBDFb28120C3611Dd9910355'
    - '0x374D9c3d5134052Bc558F432Afa1df6575f07407'
  # SKY sinks that count as a burn. Transfers to 0x…dEaD from ANY sender are
  # recorded (protocol vs other is flagged per row); transfers to the zero
  # address are recorded only from protocol senders — SKY.burn() is also what
  # the MKR↔SKY converter emits, which is not a treasury burn.
  burn_sinks:
    dead: '0x000000000000000000000000000000000000dEaD'
    zero: '0x0000000000000000000000000000000000000000'
  protocol_senders:
    - '0xBE8E3e3618f7474F8cB1d074A26afFef007E98FB'   # MCD_PAUSE_PROXY

# Chainlog keys → addresses.
contracts:
  MCD_VAT:                 '0x35D1b3F3D7966A1DFe207aa4514C12a259A0492B'
  MCD_VOW:                 '0xA950524441892A31ebddF91d3cEEFa04Bf454466'
