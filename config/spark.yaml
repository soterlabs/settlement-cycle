# Spark prime agent — multi-chain (Ethereum, Base, Arbitrum, Optimism,
# Unichain, Avalanche-C) ALM + Anchorage off-chain custodial position.
#
# Source of truth for Spark-specific addresses, ilk, venues. Venue list seeded
# from BA Labs `stars-api.blockanalitica.com/allocations/?star=spark` snapshot
# (2026-04-29) and cross-checked against `docs/ALM_COUNTERPARTIES.md` +
# `docs/pricing/allocation_pricing.csv`.
#
# Status (2026-04-29): scaffolding pass. Many venues are wired with the
# correct addresses + pricing category, but two pricing paths are NOT yet
# implemented:
#   * PSM3 (Spark's Peg Stability Module on non-Ethereum chains): the contract
#     is a basket holder (USDC + USDS + sUSDS shares); needs a dedicated source
#     and oracle kind. Marked `pricing_category: E` with `kind: psm3` for now;
#     the runtime will reject these until the source is registered.
#   * Anchorage (off-chain custodial ~$260M rolling position on Ethereum): API-only;
#     requires Anchorage developer credentials. Marked `pricing_category: E`
#     with `kind: anchorage`; same TODO.

id: spark
ilk_bytes32: '0x414c4c4f4341544f522d535041524b2d41000000000000000000000000000000'  # ALLOCATOR-SPARK-A
start_date: '2024-11-18'   # first frob on ALLOCATOR-SPARK-A (Dune query 7399640)

# Subsidised borrowing rate (debt-rate-methodology Step 1.b). Same program
# parameters as Grove. Daily reference rates in
# config/subsidy_reference_rates.yaml.
#
# ref_rate_kind is DATED: 3-month T-Bill through 2026-07-22, per Atlas
# A.2.8.2.2.2.2.2 (Borrow Rate Mechanism), which names `t-bill_rate` for
# every prime (supersedes the 2026-05-02 governance note that had Spark on
# EFFR — see QUESTIONS.md S5; the EFFR column was removed from
# config/subsidy_reference_rates.yaml on 2026-07-30). From 2026-07-23 the
# formula reads SOFR — same Stability Scope change that cut SSR to 3.52%
# and the BR−SSR spread to 20bps. Same schedule Grove uses.
subsidy:
  enabled: true
  cap_usd: 1000000000      # First $1B at subsidised rate; excess at full BR
  program_start: '2026-01-01'
  ramp_months: 24
  ref_rate_kind:
    - { kind: tbill_3m, from: '2026-01-01' }
    - { kind: sofr,     from: '2026-07-23' }

# Ilk debt from Envio HyperSync (raw Vat logs against the reorg-safe store)
# rather than Dune, so the BR charge is priced off an independently sourced
# debt timeseries. Requires ENVIO_API_TOKEN. Balances/positions stay on the
# fleet defaults — this pilot is scoped to debt and the interest charged on
# it. Same family switch Obex runs (config/obex.yaml).
sources:
  debt: hypersync

addresses:
  ethereum:
    subproxy: '0x3300f198988e4C9C63F75dF86De36421f06af8c4'    # SubProxy for ALLOCATOR-SPARK-A — holds idle USDS earning agent_rate (~$30–37M throughout 2026). Previous config had 0x691a…6ba which is the urn (the borrower position in the Vat), not the subproxy contract — confirmed by on-chain USDS balanceOf at multiple block heights showing $0 at the urn and ~$36M at this SubProxy.
    alm:      '0x1601843c5e9bc251a3272907010afa41fa18347e'    # Spark Ethereum ALM (cross-chain hub)
    # No PSM tracking on Ethereum. Sky's mainnet PSM stack (DssLitePsm +
    # DaiUsds converter + LITE-PSM-USDC pocket EOA + retail UsdsPsmWrapper)
    # is non-custodial — no per-prime balances accumulate at any contract or
    # pocket. Spark transits USDS↔USDC through this stack as atomic swaps
    # within a single tx (verified on Dune via tx 0x2c81d2de…42c0b6 trace).
    # See PRD §17.11.
  base:
    alm:      '0x2917956eff0b5eaf030abdb4ef4296df775009ca'    # Spark Base ALM
    psm:
      kind: erc4626_shares                                    # PSM3: ALM holds shares; USDS-equiv via convertToAssets
      address: '0x1601843c5e9bc251a3272907010afa41fa18347e'   # PSM3 Base (CREATE2 — same address as Spark Eth-ALM)
