# Cat A revenue allowlist — counterparties that send REALIZED YIELD directly
# to the ALM proxy.
external_alm_sources:
  ethereum:
    # Anchorage Spark escrow EOA — sends monthly USDC interest sweeps from
    # the tri-party loan (S23; ≈$260M outstanding after the May 2026 $100M
    # tranche + June 2026 $10M OTC). The principal-out side is NOT priced
    # by this mechanism (the principal lives off-chain in BTC custody);
    # only the realized interest inflows are captured. See PRD §17.13 and
    # issue #17 / Q-ID S3.
    - '0x49506c3aa028693458d6ee816b2ec28522946872'
    # PayPal / Paxos PYUSD reward payer — sends realized PayPal-PYUSD
    # rewards to the Spark ALM proxy roughly monthly (weekly since Mar
    # 2026). Cached pipeline data (token=PYUSD, holder=Spark ALM) shows
    # 15 payments Sep 2025 → Apr 2026 totaling ~$18.5M. Without this
    # entry, PYUSD ingress to S28 (PYUSD raw / ALM idle) is classified
    # as principal injection and the realized yield (~$2.5–3.2M/month
    # in 2026 Q1+Apr) is silently uncredited. Spark Dune query 6217235
    # computes the same yield synthetically as
    # ``amount × (DFEDTARL − 62.5bps + 1.8% APY) / 365``; the on-chain
    # leg captured here is the realized settlement of that accrual.
    - '0xfc0539d019482d311c161ae3b756cdccdec45e87'

# Per-(chain, source) overrides for inflows that arrive from an
# `external_alm_sources` address but should NOT be classified as yield
# (e.g. tri-party loan principal corrections or loan-termination returns).
# The Cat A classifier matches by (date, amount within $1) and reclassifies
# matching inflows as capital. Amounts in whole USD (par-stable assumption).
principal_return_overrides:
  ethereum:
    '0x49506c3aa028693458d6ee816b2ec28522946872':   # Anchorage Spark escrow
      # 2025-12-19: $5M USDC sent back to the SLL the day after one of the
      # initial disbursement transfers — recorded by Spark's accounting as
      # a partial-principal correction, not interest. Without this override
      # any retroactive Q4 2025 settlement would over-count yield by $5M.
      - date: '2025-12-19'
        amount: 5000000
        token: 'USDC'
        note: 'partial-principal correction during initial Dec disbursement window'
      # 2026-05-14: +$5,270,830 USDC received from the escrow
      #   https://etherscan.io/tx/0x1d3dd0adf2b6ab8c1bc89998bc4e370a4549382cf73a16c968c94f49445ad667
      # is Anchorage RETURNING the previous day's receipts ($5M lump +
      # $270,838.33 of streamed transfers, less $8.33) — an over-shoot
      # correction during the deployment of a NEW ~$100M tranche
      # (May 10–20: Σ outflows $105,270,838.70 − this return =
      # $100,000,008.70). Capital, not yield. Without this entry the
      # inflow is classified as external yield and S26 May revenue is
      # overstated by $5.27M. All the tranche outflows stay capital under
      # the directional default. Net May Anchorage yield = the
      # $891,780.28 May 4 interest sweep only. Pending Spark/Anchorage
      # confirmation of the tranche terms — see QUESTIONS.md S31.
      - date: '2026-05-14'
        amount: 5270830
        token: 'USDC'
        note: 'over-shoot correction during the May $100M tranche deployment, not yield'
      # 2026-07-16: +$10,036,438 USDC in ONE transfer (block 25547403) —
      # the monthly rollover of a ~$10M tranche: Anchorage returned
      # principal + final interest, and $10,000,008.64 was re-disbursed on
      # 2026-07-21 (sent twice, blocks 25580701/25580707; the duplicate
      # came back same day +$10,000,017.29 — day-net −$10.0M, capital by
      # the directional default). Without this entry the whole $10.04M
      # inflow books as external yield and S26 July revenue is overstated
      # ~6×. The ~$36.4K final-interest component embedded in the single
      # transfer CANNOT be split by the (date, amount) matcher — classified
      # capital along with the principal (conservative for the prime),
      # pending Anchorage's principal/interest split confirmation (S31).
      # July Anchorage yield therefore = the $1,198,969 Jul-12 interest
      # sweep only.
      - date: '2026-07-16'
        amount: 10036438
        token: 'USDC'
        note: 'monthly-rollover principal return (+embedded ~$36.4K final interest, unsplittable), not standalone yield'
      # STANDING RULE (no fixed maturity any more — the loan rolled over
      # at 2026-06-16 and renews monthly per Spark, 2026-07): whenever a
      # principal-sized inflow from this escrow appears (i.e. not in the
      # ~$0.9–1.5M monthly-interest range), add its entry here BEFORE that
      # month's settlement run — splitting principal vs final interest by
      # the actual amounts. Outstanding is ≈ $260M (see the S23 block), so
      # an unwind mis-classified as yield would overstate prime revenue by
      # that order of magnitude.

# Mirror of principal_return_overrides for OUTFLOWS: ALM → external-source
# transfers that return over-received yield. A matching outflow (date,
# |amount| within $1 of the DAY-NET flow for that counterparty) is
# reclassified capital → NEGATIVE yield, netting against the source's
# inflows. The directional default stays capital — principal disbursements
# to escrows must never read as negative yield — so each reversal is an
# explicit, auditable, counterparty-confirmed entry. NOTE: the classifier
# operates on per-(date, counterparty) day-net amounts; an entry only
# matches when the registered amount equals the whole day's net flow.
# No entries today (the May 2026 Anchorage case turned out to be a
# round-trip handled via principal_return_overrides above).
yield_reversal_overrides: {}
