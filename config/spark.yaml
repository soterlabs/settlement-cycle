    # ─────────────────────────────────────────────────────────────────
    # Anchorage tri-party loan — USDC, fixed-rate, BTC-backed, ROLLING
    # ─────────────────────────────────────────────────────────────────
    # Loan term:        2025-12-19 → 2026-06-16  (per result_spark_anchorage_usdc)
    # Principal history: $150M (initial, Dec 2025 disbursement)
    #                    +$100M tranche (2026-05-10 → 05-20, ~1.1K txs,
    #                      Σ outflows $105,270,838.70 − $5,270,830 overshoot
    #                      return = $100,000,008.70 — see the 2026-05-14
    #                      principal_return_overrides entry + QUESTIONS.md S31)
    #                    +$10M OTC loan (2026-06-17, rolling 1-month)
    #                    ≈ $260M outstanding as of 2026-07
    # Realised APR:     ~7.13% (May 4 sweep $891,780 annualised on the
    #                    original $150M; June 3 sweep $1,435,965 ≈ 7% on the
    #                    ~$250M average base after the May tranche — consistent)
    # Counterparty:     Anchorage Digital. Strategy "Anchorage BTC 6M 7%".
    #
    # Address trail:
    #   SLL ALM proxy (0x1601843c…347e)
    #     → Anchorage Spark escrow (0x49506C3Aa028693458d6eE816b2EC28522946872)
    #       → downstream holding wallet (0x8149c53ea54de2a62c9e4caef29478f1af4c7bd3)
    #         → off-chain BTC custody (Anchorage)
    #
    # ── How this venue contributes to monthly settlement ──
    #
    # S23 itself contributes ~$0 to prime_agent_revenue: it tracks USDC at
    # the escrow EOA, which is a near-instantaneous pass-through (Anchorage
    # forwards funds to the holding wallet within minutes, then to off-chain
    # BTC custody). Cat E inflow accounting nets the in/out flows to ≈ 0 over
    # any settlement period.
    #
    # The actual revenue capture happens on **S26 USDC raw (ALM idle)** via
    # the Cat A `external_alm_sources` mechanism: the Anchorage escrow EOA
    # is registered as an external yield source (bottom of this file), so
    # the monthly USDC interest sweeps escrow→SLL flow through Cat A par-stable
    # accounting into prime_agent_revenue. Principal-correction events on
    # the same address are listed in `principal_return_overrides` so they're
    # not mis-classified as yield. The loan did NOT terminate at the nominal
    # 2026-06-16 maturity — per Spark (2026-07) it was ROLLED OVER and now
    # renews on a rolling 1-month basis with no fixed maturity.
    #
    # Sky's BR charge on the funding is handled by the standard
    # `compute_sky_revenue` mechanic: Spark drew the USDS to fund Anchorage
    # from Sky (Vat.ilks(ALLOCATOR-SPARK-A).Art jumped +$208M during the
    # 2025-12-14 → 2025-12-19 disbursement window), and Anchorage is
    # neither PSM-netted nor SDE-reimbursed in `utilized`, so BR has been
    # charging on it cleanly the whole time — no per-venue work needed.
    #
    # Q1 2026 net effect (PR 1, 2026-05-05): prime_agent_revenue +$2.59M
    # from the three Q1 interest sweeps ($891K + $891K + $805K). Sky
    # revenue unchanged (was already correct). monthly_pnl on Anchorage
    # now matches Spark's view.
    #
    # Open follow-ups (issue #17, balance-sheet refinements, NOT numbers):
    #   - snapshot-module position value (today $0 because the escrow holds
    #     ~$0 USDC; a future TRI_PARTY_LOAN pricing path would surface
    #     `principal_at_block` so the $150M shows up in Snapshot.assets_usd)
    #   - accrual-vs-cash methodology agreement with Spark
    #   - automated principal/interest split at loan termination

