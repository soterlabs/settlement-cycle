  # ─────────────────────────────────────────────────────────────
  # Retail-facing 4626 vaults. The vault contracts (referenced via
  # ``holder_override``) custody the underlying USDC/USDT/WETH/PYUSD on
  # behalf of depositors, who hold spX shares. Spark earns the spread
  # between vault yield (deployed to lending protocols / PSM3 / sUSDS) and
  # the rate paid to depositors via share-pps growth.
  #
  # NOT held at the prime's ALMProxy → ``holder_override`` points to the
  # vault contract directly. ``pricing_category: S2`` is currently SKIPPED
  # in compute_monthly_pnl with a warning; a proper compute path needs:
  #   - Asset side:   sum of vault's underlying balance across days
  #   - Liability side: share_supply × convertToAssets(1 share)
  #   - Revenue:      Δ(asset − liability) over the period (the spread)
  # Verified on-chain 2026-05-01: all five contracts implement standard
  # ERC-4626 (decimals + asset + convertToAssets). Q1 2026 EoM sizes:
  #   - spUSDC (eth):  ~$575M underlying  | 782 holders
  #   - spUSDT (eth):  ~$1133M underlying | 690 holders
  #   - spETH  (eth):  ~81.6K WETH ≈ $185M | 243 holders
  #   - spPYUSD(eth):  ~$1.07M underlying | 13 holders
  #   - spUSDC (ava):  ~$37M underlying   | 87 holders
  # S56/S57/S59/S60 (and S58 spETH which is out of scope per
  # docs/spark/PRD_savings_vaults.md §9) are Spark Savings V2 vaults.
  # ``cof_excluded: true`` keeps their ``tw_avg_value`` out of the
  # post-hoc CoF allocation denominator: these vaults hold depositor
  # capital (USDC/USDT/PYUSD via the Savings product), NOT Sky-funded
  # USDS draws — so allocating Sky's CoF to them would mis-attribute
  # cost to capital Sky never lent. Mirrors how Grove's deposit-funded
  # idle venues are handled. Same pattern as the existing
  # ``cof_excluded`` flags on S31/S32 (sUSDS POL — already deducted
  # from utilized via cum_alm_usds).
