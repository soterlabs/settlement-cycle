  # sUSDS POL held directly at the Spark ETH ALM (~$2.25B).
  # Pricing category B (ERC-4626): value_som/eom = shares × convertToAssets(block).
  #
  # Revenue treatment: Sky charges full BR on the underlying USDS in
  # cum_debt (= SSR + 30bps). One sky_revenue adjustment applies:
  #   ``demand_side_spread: true`` — suppresses the 30bps
  #   ``susds_spread_reimbursement`` that L2 sUSDS proxies receive.
  #   The 30bps is routed via Demand Side Distribution Rewards instead
  #   (the sUSDS collateralises Spark Savings deposits; depositors are
  #   owed the SSR via the Savings product, not the prime directly).
  # The prime's compensation on this POL is the Demand Side Distribution
  # Reward, NOT the agent rate — so ``pol_agent_rate`` is NOT set here.
  # Net effect on Spark for this position: Sky charges the full 30bps
  # spread, all of which is the demand-side share routed via DSDR (outside
  # Supply Side P&L); no agent-rate refund.
  #
  # Why full BR and no utilized deduction:
  #   Although only a portion of the sUSDS held at the ALM is actively
  #   borrowed from the ilk at any given time, the entire sUSDS balance
  #   is NOT subtracted from utilized. This ensures that the full ilk debt
  #   is correctly reflected in the BR charge — subtracting would undercount
  #   the prime's actual borrowing position.
  #
  # Contrast with S37/S43/S47/S51 (L2 sUSDS POL): those are pure supply-side
  # holdings with no Savings product backing them, so they receive the
  # standard 30bps ``susds_spread_reimbursement`` (net 0bps cost).
