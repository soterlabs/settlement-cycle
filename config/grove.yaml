  # E20: Chronicle NAV oracle lives on Ethereum (oracle_chain: ethereum);
  # the pipeline translates the Avalanche EoD block to the corresponding
  # Ethereum block automatically. Verified working Dec-2025 onward
  # (NAV ~$1.020–$1.028, slowly appreciating CLO tranche).
  # E21 (GACLO-1): now reads on-chain balance × $1 (const_one oracle).
  #
  # 2026-06-05: removed ``skip: true`` to match BA Labs' balance-sheet
  # display, which reads the GACLO-1 ``balanceOf(Grove Ava ALM) × $1``
  # directly. The const_one oracle prices each token at par; value_eom
  # now equals the on-chain principal. Revenue from this venue still
  # comes from ``cash_distributions`` (Galaxy USDC sweeps to the Eth
  # ALM, ~10th of each month) — un-skip does NOT introduce double-
  # counting because the cash distribution payments hit Eth USDC (E15),
  # not GACLO-1 itself, so they don't move E21's value_eom.
  - id: E20
    chain: avalanche_c
    label: 'Janus Henderson Anemoy AAA CLO (JAAA-avalanche)'
    pricing_category: E
    token:
      address: '0x58f93d6b1ef2f44ec379cb975657c132cbed3b6b'
      symbol: 'JAAA-avax'
      decimals: 6
    # NAV: switched 2026-05-14 from Chronicle to Centrifuge's
    # pricePerShareFeed (canonical per Grove team's PnL workbook, same as
    # E8). JAAA-avax is a bridged representation of the same Centrifuge
    # vault share as JAAA_ETH, so the per-share NAV is unified — both
    # legs use the Ethereum-deployed feed. Verified on-chain 2026-05-14
    # at Feb 1 + Feb 28 boundary blocks: 250M JAAA-avax × pps gives
    # $256,109,946 / $256,892,910, matching Grove sheet ($256,109,750 /
    # $256,892,750) within $200 (<1bps). Previously used Chronicle on
    # Ethereum, which diverged ~30bps from the canonical Centrifuge feed
    # and produced a ~$302K Feb revenue gap vs Grove's workbook.
    # Chronicle is the fallback on primary failure (same oracle as E8 ETH leg).
    nav_oracle:
      kind: price_per_share_feed
      address: '0x4880799eE5200fC58DA299e965df644fBf46780B'
      oracle_chain: ethereum
      fallback: chronicle
      fallback_address: '0x02cf8C9fBa24d79886dAc40cb620f0930C6E8eC0'

  - id: E21
    chain: avalanche_c
    label: 'Galaxy Arch CLO Token (GACLO-1)'
    pricing_category: E
    # Revenue capture: Galaxy distributes CLO yield as monthly USDC sweeps
    # (~10th of each month) to the Grove Ethereum ALM. Attributed directly to
    # E21 via cash_distributions below — does not affect E15 (USDC raw) or
    # Sky revenue. The value_eom now reflects the on-chain GACLO-1 balance
    # at $1/token (const_one), matching BA Labs.
    token:
      address: '0x2c0adff8e114f3ca106051144353ac703d24b901'
      symbol: 'GACLO-1'
      decimals: 6
    nav_oracle:
      kind: const_one  # correct: CLO tokens issued/redeemed at $1; yield is a separate cash distribution
    # Off-chain notional principal funding the CLO loan (USDS minted from
    # Sky → swapped to USDC → sent to Galaxy). The ALM holds $0 on-chain
    # but Sky still charges BR on this $50M (it's part of utilized). Without
    # this field the per-venue CoF allocation gives E21 a $0 share and the
    # ~$150K/month of CoF that should attribute to E21 silently spreads
    # across other venues' rows.
    # Date-ranged so the planned termination (2026-06-16 — Galaxy loan
    # maturity per the original deal) flips notional to $0 automatically
    # for any settlement run past that date, without needing a manual YAML
    # edit. Pre-termination behaviour is identical to the prior scalar form.
    notional_principal_usd:
      - start_date: '2025-12-19'   # initial disbursement to Galaxy
        amount: 50000000
      - start_date: '2026-06-16'   # planned loan termination
        amount: 0
    cash_distributions:
      - payer: '0xaC3D86f9840A8bE07dE5F67d6427983B7009DF1B'  # Galaxy sweep address
        token: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'   # USDC on Ethereum
        chain: ethereum  # distributions land on the Ethereum ALM, not Avalanche

