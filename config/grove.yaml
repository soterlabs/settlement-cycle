# Grove prime agent — multi-venue, multi-asset, RWA + on-chain credit book.
# Phase 2.A scope: Ethereum venues only (12 yield-bearing positions).
# Cross-chain (Base, Avalanche, Plume, Monad) deferred to Phase 2.B+.
#
# Sources:
# - Token addresses + oracles: docs/pricing/allocation_pricing.csv
# - ALM addresses: docs/pricing/holding_addresses.csv
# - Ilk + subproxy + start dates: docs/grove/PRD.md §3
# - Venue inventory: docs/grove/PRD.md §4.1 (E1–E18, with E5/E6/E18 notes below)

id: grove
ilk_bytes32: '0x414c4c4f4341544f522d424c4f4f4d2d41000000000000000000000000000000'  # ALLOCATOR-BLOOM-A
start_date: '2025-05-14'  # First frob (test mint, unwound 2025-06-25)

# Subsidised borrowing rate (debt-rate-methodology Step 1.b).
# Sky charges `ref_rate + (BR − ref_rate) × T/24` on the first cap_usd of
# utilized USDS, where T = months elapsed since program_start (2026-01-01).
# For Feb 2026 → T=1 → subsidy ≈ ref_rate + (BR−ref_rate)/24, matching the
# Grove team's PnL workbook exactly. Reference rate values live in
# config/subsidy_reference_rates.yaml.
#
# ref_rate_kind is DATED: 3-month T-Bill through 2026-07-22, per Atlas
# A.2.8.2.2.2.2.2 (QUESTIONS.md S5); SOFR from 2026-07-23 — the Stability
# Scope change that cut SSR to 3.52% and the BR−SSR spread to 20bps also
# switched the subsidy reference series. Same schedule Spark uses.
subsidy:
  enabled: true
  cap_usd: 1000000000      # First $1B at subsidised rate; excess at full BR
  program_start: '2026-01-01'
  ramp_months: 24
  ref_rate_kind:
    - { kind: tbill_3m, from: '2026-01-01' }
    - { kind: sofr,     from: '2026-07-23' }

addresses:
  ethereum:
    subproxy: '0x1369f7b2b38c76B6478c0f0E66D94923421891Ba'    # holds idle USDS / sUSDS — earns agent rate
    alm:      '0x491edfb0b8b608044e227225c715981a30f3a44e'    # holds all allocation positions
    # No PSM tracking on Ethereum. Sky's mainnet PSM stack (DssLitePsm +
    # DaiUsds converter + LITE-PSM-USDC pocket EOA + retail UsdsPsmWrapper)
    # is non-custodial — no per-prime balances accumulate at any contract or
    # pocket. Grove transits USDS↔USDC through this stack as atomic swaps
    # within a single tx (verified on Dune: zero idle USDS / DAI / USDC
    # owned by Grove at any of these addresses). See PRD §17.11.
  base:
    alm:      '0x9b746dbc5269e1df6e4193bcb441c0fbbf1cecee'    # Grove Base ALM (per docs/pricing/holding_addresses.csv)
  avalanche_c:
    alm:      '0x7107dd8f56642327945294a18a4280c78e153644'    # Grove Avalanche-C ALM (verified on-chain via JAAA holdings)
  plume:
    alm:      '0x1db91ad50446a671e2231f77e00948e68876f812'    # Grove Plume ALM (per docs/pricing/holding_addresses.csv)
  monad:
    alm:      '0x94b398acb2fce988871218221ea6a4a2b26cccbc'    # Grove Monad ALM EOA (per docs/pricing/holding_addresses.csv)

