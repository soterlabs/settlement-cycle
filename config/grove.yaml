    nav_oracle:
      kind: const_one
    # BlackRock's BUIDL contract mints both capital subscriptions AND yield
    # distributions to ALM (both arrive as ERC-20 mints from 0x0). A bimodal
    # histogram on observed amounts (Dune query 7387737) shows a clean gap
    # between yield (<$1M, dozens per period) and capital (≥$10M, a few
    # large round-number mints). Filter at $1M to isolate capital flow for
    # cost-basis tracking — sub-threshold mints contribute to revenue.
    min_transfer_amount_usd: 1000000
    # BlackRock charges a flat $15,000 administrative fee on some capital
    # operations — the fee is baked into the on-chain mint/burn amount at
    # source (e.g. a $50M subscription mints $49,985K to the ALM). The
    # empirical Jan-Apr 2026 pattern shows fee-charged events on
    # subscriptions; whether redemptions are also fee-charged is unknown
    # from the data we have (no negative-direction events in the period).
    # MSC detects fee events by the "shaved amount" signature regardless of
    # direction — see ``Venue.fixed_fee_per_capital_event_usd`` in
    # ``domain/primes.py`` and the inline implementation in
    # ``compute_venue_revenue``. Fee × n_events is subtracted from
    # actual_revenue before the SDE split; flows entirely to Sky (BUIDL is
    # fixed SDE → sd_share = 1).
    #
    # Verified Jan-Apr 2026: 0 / 5 / 1 / 0 fee events → 0 / $75K / $15K / 0
    # deduction → reconciles MSC ↔ Grove BUIDL line exactly. Subscriptions
    # that were NOT fee-charged in the period landed at clean round numbers
    # (e.g., Mar 23-31: $50M, $25M each) — those correctly pass through.
    fixed_fee_per_capital_event_usd: 15000

