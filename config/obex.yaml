# OBEX prime agent — single venue (Maple syrupUSDC) on Ethereum.
# Source of truth for OBEX-specific addresses, ilk, venues.

id: obex
ilk_bytes32: '0x414c4c4f4341544f522d4f4245582d4100000000000000000000000000000000'  # ALLOCATOR-OBEX-A
start_date: '2025-11-17'  # OBEX calendar_start_date

addresses:
  ethereum:
    subproxy: '0x8be042581f581E3620e29F213EA8b94afA1C8071'
    alm:      '0xb6dD7ae22C9922AFEe0642f9Ac13e58633f715A2'
    # No PSM tracking. Sky's mainnet PSM stack (DssLitePsm + DaiUsds converter
    # + LITE-PSM-USDC pocket EOA + UsdsPsmWrapper) is non-custodial — no
    # per-prime balances accumulate at any contract or pocket. OBEX transits
    # USDS↔USDC through this stack as atomic swaps within a single tx, same
    # as Grove and Spark. See PRD §17.11. OBEX has no L2 PSM3 either (single-
    # chain prime).

venues:
  - id: V1
    chain: ethereum
    label: 'Maple syrupUSDC (Category B — ERC-4626 vault)'
    pricing_category: B
    token:
      address: '0x80ac24aa929eaf5013f6436cda2a7ba190f5cc0b'
      symbol: 'syrupUSDC'
      decimals: 6
    underlying:
      address: '0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48'
      symbol: 'USDC'
      decimals: 6

# Source dispatch. Defaults (debt → Dune, balances → Dune, prices → RPC +
# on-chain oracles) live in `src/settle/normalize/registry.py`. Overrides below
# migrate individual backends per-prime. OBEX is the HyperSync pilot: debt and
# balances come from Envio HyperSync (raw logs, reorg-safe store) instead of
# Dune. Requires ENVIO_API_TOKEN. Prices/oracles still use RPC.
sources:
  debt: hypersync
  balance: hypersync
  position_balance: hypersync
