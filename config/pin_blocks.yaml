# Centralized per-month settlement pin blocks — the single source of truth.
#
# Each value is the last block on that chain whose timestamp is
# <= <period boundary> 23:59:59 UTC (an "end-of-day" block). For a given
# month M: `som` = start-of-month boundary (= previous month's `eom`),
# `eom` = end-of-month boundary.
#
# Consumed by (via src/settle/domain/pin_blocks.py):
#   * scripts/run_spark_2026.py, scripts/run_grove_2026.py  (som + eom)
#   * scripts/extend_spark_fixtures.py,
#     scripts/capture_spark_inflow_by_counterparty.py        (eom)
#   * replay/grove_2026_06/_capture_dune_fixtures.py       (som + eom)
#
# Each entry carries the union of chains across primes; consumers filter to
# the chains their prime actually uses. Shared chains (ethereum, base,
# avalanche_c) are identical across primes.
#
# Resolution: eth/base/arb/op/avax via Dune evms.blocks; unichain/plume/monad
# via RPC binary search (rpc.find_block_at_or_before). 2026-06 eth EoM is
# 25433938 == 2026-06-30T23:59:59Z (25433939 is already next-day).
#
# NOTE (Monad Q1): Monad mainnet was not active for Grove in Q1 2026, so its
# Jan-Mar boundary blocks are monotonic placeholders (1,2,3,4) — E33/E34/E35
# V3 reads degrade to $0 there. Monad becomes real from the Apr SoM onward,
# which is why 2026-04 `som.monad` (65143725) intentionally differs from
# 2026-03 `eom.monad` (4).

