# Skybase prime agent — agent-rate-only (no supply-side primitives).
#
# Skybase has no allocator ilk and no ALM venues; its entire settlement is
# the demand-side agent rate (SSR + 20bps) earned on the subproxy's treasury
# holdings (USDS at SSR+20bps; sUSDS at +20bps over the index accrual).
# ``ilk_bytes32`` is intentionally absent — the pipeline returns a zero-debt
# series and sky_revenue / prime venue revenue are 0 by construction.
#
# Settled since MSC #5/6; demand-side totals on the forum:
#   Feb (incl. distribution rewards) · Mar 225,299 USDS · Apr 201,469 USDS.
# NOTE: forum demand-side totals include Distribution Rewards on top of the
# treasury agent rate — this pipeline computes the agent-rate component only.

id: skybase
start_date: '2025-12-01'

# Governance Accessibility Rewards — Demand-Side primitive: 1% of the
# SAME month's consolidated Sky Net Revenue (settlements/sky_total, whose
# SNR definition matches BA's "Net revenue" line), applied to every report
# month from 2026-01 (operator decision 2026-08-06). The month-N report
# carries month N's GAR; the cash is paid at the MSC executing in N+1
# (July's GAR rides MSC#11 in August). See src/settle/compute/gar.py.
#
# RETIRED from the MSC (operator decision 2026-09): ``until`` is the first
# month that does NOT carry GAR, so the primitive applies to 2026-01…2026-07
# only. Bounded rather than deleted so the settled months stay reproducible —
# deleting it would mean a re-run of any of them silently dropped the line,
# and their ``provenance.json`` is gitignored, so there would be no way back.
gar:
  share: 0.01
  from: '2026-01'
  until: '2026-08'

addresses:
  ethereum:
    subproxy: '0x08978E3700859E476201c1D7438B3427e3C81140'

# Source backend: Envio HyperSync instead of Dune for debt + balances (see
# registry.py / normalize/sources/hypersync_*). Skybase is agent-rate-only, so
# debt is a no-op (no ilk); balance drives the subproxy USDS/sUSDS agent-rate
# base. Prices/SSR/DR unaffected. Requires ENVIO_API_TOKEN.
sources:
  debt: hypersync
  balance: hypersync
  position_balance: hypersync
