# Subsidy reference rate — daily values used in the subsidised borrowing
# rate formula (debt-rate-methodology):
#
#   subsidised_apr_d = ref_rate_d + (base_apr − ref_rate_d) × T / 24
#
# where T is the number of months elapsed since the subsidy program start
# (2026-01-01 per Sky governance — i.e. T=1 for Feb 2026, T=2 for Mar, …).
#
# TWO series live here, one column each; each prime's ``subsidy.
# ref_rate_kind`` (scalar or dated list) selects per date:
#
#   tbill_3m_apy — reference rate through 2026-07-22, per Atlas
#     A.2.8.2.2.2.2.2 (Borrow Rate Mechanism): both Spark and Grove are
#     subsidised at `t-bill_rate + (base_rate − t-bill_rate) × T/24` over
#     the first $1B of USDS for 24 months from 2026-01-01.
#     (QUESTIONS.md S5, resolved 2026-07-30.)
#   sofr_apr — reference rate FROM 2026-07-23 (inclusive). NOMINAL (APR),
#     used exactly as published: the NY Fed publishes SOFR as an annualised
#     simple rate and Atlas defines it as "expressed as an annual rate", so
#     no APY conversion is applied (2026-09-01; PRD §17.13). NB the Fed
#     annualises on actual/360 while we accrue on n/365 — a known ~1.39%
#     under-accrual, tracked in SNR_QUESTIONS.md pending an Atlas
#     clarification. The 2026-07-23
#     Stability Scope change (same executive vote that cut SSR 3.60% →
#     3.52% and the BR−SSR spread 30 → 20 bps) switched the subsidy
#     formula to `sofr + (base_rate − sofr) × T/24`.
#
# SOURCE (sofr_apr) — the NY Fed's official SOFR publication, `percentRate`
# per effective date, verbatim:
#
#   https://markets.newyorkfed.org/api/rates/secured/sofr/search.json
#     ?startDate=2026-07-01&endDate=2026-07-31
#
# (fetched 2026-08-03; SOFR for date d publishes the next business day.)
#
# SOURCE (tbill_3m_apy) — every row is the `3 Mo` column of the Treasury's
# **daily yield curve**, verbatim, one row per published business day:
#
#   https://home.treasury.gov/resource-center/data-chart-center/
#   interest-rates/TextView?type=daily_treasury_yield_curve
#
#   CSV: .../daily-treasury-rates.csv/2026/all
#        ?type=daily_treasury_yield_curve&field_tdr_date_value=2026&_format=csv
#
# NOTE the dataset: it is the yield-curve `3 Mo` series, NOT the separate
# "daily treasury bill rates" file — the 13-week bill's bank-discount and
# coupon-equivalent quotes there differ by ~8-15 bps and will not reconcile.
#
# HISTORY (2026-07-31) — this file was rebuilt from the primary source after
# two defects were found while migrating Spark off EFFR:
#   * March 2026 carried five hand-entered rows describing a smooth
#     3.66% → 3.58% decline. The actual 3 Mo prints were roughly flat at
#     3.71–3.74%. Every March value was wrong, understating the rate by
#     6–14 bps and therefore overstating both primes' subsidy.
#   * January 2026 carried exactly two rows (2026-01-01 and 2026-01-31),
#     both at 3.67%, and BOTH fall on non-trading days — so the whole month
#     was an unverifiable carry-forward. The real prints run 3.62–3.71%,
#     dipping to 3.62% mid-month and peaking at 3.71% on Jan 22.
# Feb / Apr / May / Jun already matched the source exactly on the dates they
# covered; they are now simply complete rather than weekly.
#
# HISTORY (2026-07-30) — the EFFR column that used to live here was removed.
# A 2026-05-02 governance note (reaffirmed by Spark 2026-05-06) had Spark on
# EFFR, contradicting Atlas. For anyone reproducing pre-2026-07 numbers:
# EFFR ran ~3.64% Jan–Apr easing to ~3.62% by late May and 3.62–3.63% in
# June. Published MSC#5–MSC#10 Spark figures used EFFR; git history before
# that commit is the only way to reproduce them.
#
#   tbill_3m_apy:  treasury.gov daily yield curve, `3 Mo`
#   sofr_apr:      markets.newyorkfed.org SOFR `percentRate`
#
# Each prime's ``subsidy.ref_rate_kind`` selects the column(s); valid kinds
# are ``tbill_3m`` and ``sofr`` (``settle.domain.subsidy._VALID_REF_RATE_KINDS``).
# A row may carry either column or both; the loader skips rows lacking the
# requested column, so the two series need not cover the same dates.

# Use the most-recent rate ≤ the target date (carry-forward, like SSR).
# With a row per business day the only carry-forward is across weekends and
# federal holidays — at most 4 days (a Thu-print before a Mon holiday). 2025-12-31 is retained as the
# anchor for 2026-01-01 (New Year's Day — no print).
