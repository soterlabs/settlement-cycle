# Subsidy reference rate — daily values used in the subsidised borrowing
# rate formula (debt-rate-methodology):
#
#   subsidised_apy_d = ref_rate_d + (base_apy − ref_rate_d) × T / 24
#
# where T is the number of months elapsed since the subsidy program start
# (2026-01-01 per Sky governance — i.e. T=1 for Feb 2026, T=2 for Mar, …).
#
# The reference rate is the **3-month T-Bill** for EVERY prime, per Atlas
# A.2.8.2.2.2.2.2 (Borrow Rate Mechanism): both Spark and Grove are
# subsidised at `t-bill_rate + (base_rate − t-bill_rate) × T/24` over the
# first $1B of USDS for 24 months from 2026-01-01. Atlas names no other
# series.
#
# HISTORY — the EFFR column that used to live here was removed 2026-07-30.
# A 2026-05-02 governance note (reaffirmed by Spark on 2026-05-06) had Spark
# on EFFR, contradicting Atlas; that contradiction was tracked as
# QUESTIONS.md S5 and is resolved in Atlas's favour. Consequences of the
# switch, for anyone reproducing pre-2026-07 numbers: EFFR ran ~3.64%
# Jan–Apr 2026 easing to ~3.62% by late May and ~3.62–3.63% in June, while
# the 3M T-Bill ran ~3.58–3.72% Jan–May and stepped up to 3.78–3.87% through
# June. The published MSC#5–MSC#10 Spark figures used EFFR; git history
# before this commit is the only way to reproduce them.
#
#   tbill_3m_apy:  treasury.gov 3M T-Bill (also matches the Grove workbook)
#
# Source URL:
#   T-Bill:  https://home.treasury.gov/resource-center/data-chart-center/
#            interest-rates/TextView?type=daily_treasury_yield_curve

# Each prime's ``subsidy.ref_rate_kind`` in its own YAML drives the lookup
# against the rate column below. ``tbill_3m`` is currently the only valid
# value (see ``settle.domain.subsidy._VALID_REF_RATE_KINDS``).

# Use the most-recent rate ≤ the target date (carry-forward, like SSR).
# Weekend/holiday gaps fall through to the previous business-day rate.
rates:
  # 2026-01 — T-Bill 3M (carry-forward to fill weekends; values from
  # treasury.gov daily yield curve. Used to verify Grove sheet methodology.)
  - effective_date: '2026-01-01'
    tbill_3m_apy: 0.0367
  - effective_date: '2026-01-31'
    tbill_3m_apy: 0.0367

