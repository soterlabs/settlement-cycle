    - '2222'
    # absent from the HyperSync workbook:
    - '2000'
    - '2003'
    - '2012'

  skybase:
    - '0'        # explicit on-chain referral, Ethereum. L2 sUSDS splits to 10000/10001
    - '1'
    - '1001'     # from Feb 2026 payments may have been applied to 1016
    - '1002'
    - '1004'     # aggregator (Paraswap) — see `aggregators` note below
    - '1007'     # aggregator (Yearn)
    - '1016'     # aggregator
    - '1017'
    # absent from the HyperSync workbook:
    - '1015'

  keel:
    - '4001'     # synthetic: USDS in Solana OFT Bridge; no Referral event, whole balance attributed
    - '4011'     # aggregator (1inch)
    # absent from the HyperSync workbook:
    - '4012'

  # No config or runner in this repo; listed so its codes are not flagged
  # unknown if the workbook carries them.
  osero:
    - '3000'
    - '3333'
    # absent from the HyperSync workbook:
    - '3001'
    - '3007'
    - '3008'

# Codes deliberately not paid to any prime.
unattributed:

  # Untagged / synthetic buckets that belong to no single prime. These were
  # the legacy Summary's "Other" group.
  other:
    - '-999999'  # synthetic: untagged USDS-CLE / USDS-SKY / USDS-SPK / stUSDS
    - '99'       # synthetic: untagged sUSDS
    - '10000'    # synthetic: L2 sUSDS tagged by default PSM3 Swap events (split from code 0)
    - '10001'    # synthetic: smart-contract-held L2 sUSDS (split from code 0)
    - '13425'
    - '9998'     # absent from the HyperSync workbook

  # Newly attributed by the HyperSync aggregator work (settle-dr-dune b287c02)
  # and NOT present in the legacy Summary, so it has never been settled to any
  # prime. Aggregator DR is out of scope pending a methodology decision
  # (2026-06 scope call; reconciliation post §2.2) — note that the aggregator
  # codes already sitting under skybase/keel above (1004, 1007, 1016, 4011)
  # predate that call and are grandfathered, which is itself inconsistent and
  # wants resolving.
  #
  # Leaving 1003 here preserves current behaviour exactly: it was never paid.
  # Moving it under a prime would transfer ~$301.6K (Jan–Jun 2026).
  pending_methodology:
    - '1003'     # CowSwap — synthetic delivery tagging in the unified stream
