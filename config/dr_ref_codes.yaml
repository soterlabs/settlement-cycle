# Distribution Rewards: referral code → prime agent attribution.
#
# WHY THIS FILE EXISTS
# --------------------
# Until 2026-07 the mapping lived in the `group` column of the `Summary` tab
# of `settle-dr-dune/dune-results/dr_comparison_latest.xlsx`. The HyperSync
# rebuild of that pipeline (`hypersync-results/dr_comparison_hypersync.xlsx`)
# emits no `Summary` tab and no `group` column — `Soter by Ref Code` is a flat
# `ref_code | month… | total | tokens | notes` sheet. Attribution therefore
# moves here, versioned next to the settlement logic that depends on it.
#
# The initial contents were lifted verbatim from the old `Summary` tab's
# `group` column at submodule pin 962f9f6, so the migration is behaviour-
# preserving for every code that existed before.
#
# CONTRACT
# --------
# * A ref code appearing under a prime key is that prime's DR.
# * `unattributed:` lists codes deliberately NOT paid to any prime. They must
#   be listed explicitly — the loader treats an unknown code as an error-level
#   warning naming the dollar amount, so newly-appearing codes can never
#   silently vanish from a settlement.
# * Codes may appear exactly once across the whole file; the loader enforces
#   this at load time.
# * Codes marked `absent` were in the legacy Summary but carry no row in the
#   HyperSync workbook. Retained for provenance; they contribute $0.
# * Amounts and notes come from the workbook, never from here. This file
#   answers only "whose is it?".
# * `retired_from:` stops a prime EARNING DR from a given month onward. Its
#   codes stay listed under `primes:` so the unknown-code guard keeps
#   covering them; only the payout stops.

# ── DR retirement, per prime ────────────────────────────────────────────
# First month in which the prime earns NO Distribution Rewards. Earlier
# months are untouched and stay reproducible — a date bound rather than a
# deletion, for the same reason as Skybase's GAR bound (see
# config/skybase.yaml): the ref codes must keep resolving for the settled
# months, whose `provenance.json` is gitignored and so unrecoverable.
#
# keel — DR removed from 2026-08 (operator decision 2026-09). Keel's codes
# (4001 synthetic Solana OFT bridge balance, 4011 1inch) still appear in the
# workbook, so this deliberately leaves that DR attributed-but-unpaid rather
# than reassigning it; whether 4001/4011 should instead move to
# `unattributed:` going forward is a separate call.
retired_from:
  keel: '2026-08'

primes:

  spark:
    - '127'      # synthetic: untagged sUSDC
    - '128'
    - '129'
    - '130'      # synthetic: untagged spUSDT
    - '131'      # synthetic: untagged spUSDC (combined into 128 by Spark on Dune)
    - '132'      # synthetic: untagged spPYUSD (combined into 128 by Spark on Dune)
    - '171'
    - '182'
    - '183'
    - '186'
    - '188'
    - '190'
    - '191'
    - '192'
    - '194'
    - '195'
    - '196'
    - '197'      # stUSDS
    - '198'
    - '200'
    - '202'
    - '204'
    - '205'
    - '214'
    - '216'
    - '217'      # new in the 2026-07 workbook: spUSDC/spUSDT integrator ($0.50 Jul 2026); in Spark's 100–999 ref-code range (Q-S21)
    - '219'
    - '224'
    - '303'
    - '555'
    - '9001'     # synthetic: USDS in Aave aEthUSDS; no Referral event, whole balance attributed
    # absent from the HyperSync workbook (legacy Summary only):
    - '2'
    - '100'
    - '170'
    - '184'
    - '206'
    - '223'
    - '999'

  grove:
    - '2001'
    - '2002'
    - '2005'
    - '2008'
    - '2012'     # was 'absent'; first HyperSync row is 2026-08 ($3,093.73)
    - '2222'
    # absent from the HyperSync workbook:
    - '2000'
    - '2003'

  skybase:
    - '0'        # explicit on-chain referral, Ethereum. L2 sUSDS splits to 10000/10001
    - '1'
    - '1001'     # from Feb 2026 payments may have been applied to 1016
    - '1002'
    - '1003'     # aggregator (CowSwap) — see `aggregator treatment` below
    - '1004'     # aggregator (Paraswap)
    - '1007'     # aggregator (Yearn)
    - '1016'     # aggregator
    - '1017'
    # absent from the HyperSync workbook:
    - '1015'

  keel:
    - '4001'     # synthetic: USDS in Solana OFT Bridge; no Referral event, whole balance attributed
    - '4011'     # aggregator (1inch)
    # absent from the HyperSync workbook:
    - '4012'

  # Osero settles from this repo since the 2026-07 cycle (config/osero.yaml
  # + scripts/run_osero_2026.py), so these codes now feed a real report.
  osero:
    - '3000'
    - '3009'     # gtSkyLooping Morpho strategy — new in settle-dr-dune 2f9cfd3
                 # ("Custody perimeters"); first row is 2026-08 ($21.19).
                 # Without this entry the loader raises an error-level warning
                 # and the amount silently leaves Osero's demand side.
    - '3333'
    # absent from the HyperSync workbook:
    - '3001'
    - '3007'
    - '3008'

# Codes deliberately not paid to any prime.
unattributed:

  # Untagged / synthetic buckets that belong to no single prime. These were
  # the legacy Summary's "Other" group.
  other:
    - '-999999'  # synthetic: untagged USDS-CLE / USDS-SKY / USDS-SPK / stUSDS
    - '99'       # synthetic: untagged sUSDS
    - '10000'    # synthetic: L2 sUSDS tagged by default PSM3 Swap events (split from code 0)
    - '10001'    # synthetic: smart-contract-held L2 sUSDS (split from code 0)
    - '13425'
    - '9998'     # absent from the HyperSync workbook

  # (none currently — see `aggregator treatment` below)

# AGGREGATOR TREATMENT
# --------------------
# Every aggregator code the workbook carries is now attributed:
#   1003 CowSwap  → skybase   (assigned 2026-07-31)
#   1004 Paraswap → skybase
#   1007 Yearn    → skybase
#   1016          → skybase
#   4011 1inch    → keel
#
# 1003 is new in the HyperSync workbook (settle-dr-dune b287c02, aggregator
# attribution in the unified TWA stream) and was absent from the legacy
# Summary, so it had never been settled to anyone. Attributing it to Skybase
# moves ~$301.6K (Jan–Jun 2026) onto Skybase's demand side.
#
# Note this supersedes the "aggregators are out of scope" language in
# reconciliation post §2.2 / the 2026-06 scope call. That exclusion was
# already only half-honoured — 1004/1007/1016/4011 were attributed in the
# legacy Summary and flagged "needs methodology update" — so aggregator DR is
# now uniformly included rather than inconsistently split. §2.2 should be
# updated to match on the next reconciliation post.
