name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

# Cancel superseded PR runs so only the latest commit gets a verdict.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[api,dev]"
      - name: Run pytest (unit tests only)
        # Live-marked tests hit real RPC / Dune / API and are skipped by
        # default; they're not safe to run in CI without credentials.
        # ``-m "not live"`` is a belt-and-braces filter on top of the
        # default deselection.
        #
        # ENVIO_API_TOKEN: the HyperSync client resolves its bearer token
        # before the (mocked) transport is called, so mock-transport unit
        # tests still need the variable set. Secrets are not exposed to
        # pull requests from forks — those runs fall back to a dummy value.
        env:
          ENVIO_API_TOKEN: ${{ secrets.ENVIO_API_TOKEN || 'ci-dummy-token' }}
        run: pytest tests/unit -m "not live" -q

  input-cache-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: settle_test
          POSTGRES_PASSWORD: settle_test
          POSTGRES_DB: settle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settle_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[api,dev]"
      - name: Verify durable input reuse across worker restarts
        env:
          PYTHON_DOTENV_DISABLED: '1'
          SETTLE_TEST_POSTGRES_URL: postgresql://settle_test:settle_test@localhost:5432/settle_test
        run: pytest tests/integration/test_input_cache_postgres.py tests/integration/test_revenue_reuse.py tests/integration/test_revenue_store.py tests/integration/test_revenue_worker.py tests/integration/test_revenue_api.py tests/integration/test_revenue_reference_rates.py tests/integration/test_required_input_publication.py tests/integration/test_monthly_from_revenue.py -q
